
  <div class="container">

    <div class="lado-imagem">
      <img src="img/ranger.png" alt="Ford Ranger" id="imagemCarro">
    </div>

    <div class="lado-login">
      <img src="img/ford.png" alt="Logo Ford" class="logo">

      <h2>Boas-vindas</h2>

      <form id="formLogin">
        <input type="text" id="usuario" placeholder="Insira seu e-mail" required>
        <input type="password" id="senha" placeholder="Insira sua senha" required>

        <div class="opcao-logar">
          <span>Logar automaticamente</span>
          <input type="checkbox" id="logarAuto">
        </div>

        <button type="submit">Entrar</button>

        <p id="mensagemErro"></p>
      </form>
    </div>

  </div>

  <script src="login.js"></script>
