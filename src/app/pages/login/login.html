
  <div class="container">

    <div class="lado-imagem">
      <img src="img/ranger.png" alt="Ford Ranger" id="imagemCarro">
    </div>

    <div class="lado-login">
      <img src="img/ford.png" alt="Logo Ford" class="logo">

      <h2>Boas-vindas</h2>

      <form #loginFrom="ngForm" (ngSubmit)="login()" id="formLogin">
        <input type="text" name="nome" [(ngModel)]="usuario.nome" id="usuario" placeholder="Insira seu login" required>
        <input type="password" name="senha" [(ngModel)]="usuario.senha" id="senha" placeholder="Insira sua senha" required>

        <div class="opcao-logar">
          <span>Logar automaticamente</span>
          <input type="checkbox" id="logarAuto">
        </div>

        <button type="submit">Entrar</button>

        <p id="mensagemErro" *ngIf="mensagemDeErro">{{ mensagemDeErro }}</p>
      </form>
    </div>

  </div>
